  const stars = rem>0 ? (S.hints<=3 ? 3 : 2) : 1;
  const verdict = ["", "Mission accomplie… en prolongation ! Ouf, la coupe n'a pas fondu.", "Belle victoire ! Peut-être un peu trop d'indices…", "Victoire légendaire ! Le Maître du Sifflet s'incline."][stars];
  const date = new Date(S.end).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  main.innerHTML=`
    <header class="hero" style="padding-top:30px">
      <div class="kicker">MISSION ACCOMPLIE</div>
      <h1>LA COUPE D'OR<br>EST SAUVÉE !</h1>
    </header>
    <div style="display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:-6px auto 6px"><div style="width:min(220px,55vw)">${EG.trophySvg()}</div><div title="Gaston">${EG.hamster(110)}</div></div>
    <div class="panel">
      <div class="whistle-msg"><div class="av">${EG.avatar(70)}</div><div class="bubble">${EG.STORY.ending.map(p=>`<p style="margin:0 0 8px">${p}</p>`).join('')}</div></div>
      <div class="stats">
        <div class="stat"><div class="v">${EG.fmt(used)}</div><div class="k">Temps de jeu</div></div>
        <div class="stat"><div class="v">${rem>0?EG.fmt(rem):'0:00'}</div><div class="k">Temps restant</div></div>
        <div class="stat"><div class="v">${S.hints}</div><div class="k">Indices (−${S.hints} min)</div></div>
        <div class="stat"><div class="v">${S.errors}</div><div class="k">Erreurs</div></div>
      </div>
      <p style="text-align:center;font-weight:900;font-size:19px;color:var(--gold)">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)} — ${verdict}</p>
    </div>

    <div class="diploma" id="diploma">
      <div style="font-weight:800;letter-spacing:3px;color:#7a5a20">DIPLÔME OFFICIEL DE L'ASSOCIATION SPORTIVE</div>
      <h2>Arbitres officiels de l'AS</h2>
      <p>Le Maître du Sifflet nomme officiellement l'équipe</p>
      <div class="team">${EG.esc(S.team)}</div>
      <p>s'est échappée des 6 salles piégées, a maîtrisé les règlements, la sécurité, la santé et le fair-play,<br>a sauvé la Coupe d'Or (et Gaston le hamster) en <b>${EG.fmt(used)}</b>.</p>
      <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <p style="margin-bottom:0">Le ${date} — <i>Tweeeet !</i></p>
    </div>

    <div class="no-print" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px">
      <button class="btn" id="printBtn">🖨️ Imprimer le diplôme</button>
      <a class="btn ghost" href="#accueil">🗺️ Retour au plan</a>
    </div>
    <p class="no-print" id="printMsg" style="text-align:center;color:var(--muted)"></p>`;
  document.getElementById('printBtn').onclick=()=>{
    try{ window.print(); }catch(e){}
    document.getElementById('printMsg').textContent="Si l'impression ne s'ouvre pas, faites une capture d'écran du diplôme 📸";
  };
  EG.confetti(); EG.SFX.win();
})();

}},
"prof":{html:"<div class=\"spotlights\"><span></span><span></span></div>\n<main class=\"wrap\">\n  <header class=\"hero\" style=\"padding:30px 0 10px\">\n    <div class=\"kicker\">MAÎTRE DU JEU</div>\n    <h1 style=\"font-size:clamp(28px,5vw,48px)\">ESPACE PROFESSEUR</h1>\n  </header>\n\n  <section id=\"gate\" class=\"panel\" style=\"max-width:480px;margin:auto;text-align:center\">\n    <p>Entrez le mot de passe professeur :</p>\n    <form id=\"gateForm\" class=\"team-form\" style=\"justify-content:center\">\n      <input id=\"pwd\" type=\"password\" placeholder=\"Mot de passe\" autocomplete=\"off\">\n      <button class=\"btn\" type=\"submit\">Entrer</button>\n    </form>\n    <p id=\"gateMsg\" class=\"feedback bad\"></p>\n    <a href=\"#accueil\">← Retour au jeu</a>\n  </section>\n\n  <section id=\"zone\" hidden>\n    <div class=\"panel\" style=\"margin-bottom:18px\">\n      <h2>🎛️ Commandes (sur cet appareil)</h2>\n      <p style=\"color:var(--muted);margin-top:0\">La partie est enregistrée dans le navigateur de chaque appareil : ces boutons agissent uniquement sur l'appareil où vous êtes.</p>\n      <div id=\"status\" style=\"margin-bottom:12px;font-weight:800\"></div>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n        <button class=\"btn small teal\" id=\"plus\">+5 min</button>\n        <button class=\"btn small ghost\" id=\"minus\">−5 min</button>\n        <button class=\"btn small ghost\" id=\"unlock\">🔓 Débloquer toutes les salles</button>\n        <button class=\"btn small\" id=\"reset\">↺ Réinitialiser la partie</button>\n        <a class=\"btn small ghost\" href=\"#accueil\">🗺️ Aller au jeu</a>\n      </div>\n    </div>\n\n    <div class=\"panel\" style=\"margin-bottom:18px\">\n      <h2>📋 Conseils d'organisation</h2>\n      <ul>\n        <li><b>Durée :</b> 50 min de jeu (+ 5 min de lancement et 5 min de bilan).</li>\n        <li><b>Équipes :</b> 2 à 4 élèves par tablette / ordinateur. Un « maître du clavier » qui tourne à chaque salle.</li>\n        <li><b>Principe :</b> escape game « point & click ». Dans chaque salle, les élèves cliquent sur le décor pour fouiller, ramassent des objets (inventaire), les utilisent (sélectionner l'objet puis cliquer sur un élément), lisent des documents et ouvrent des cadenas à molettes.</li>\n        <li><b>Déroulement :</b> 6 salles (vestiaires, gymnase, stade, salle de gym, infirmerie, salle des trophées). Lettres obtenues : E, P, I, U, Q + E (médaille de la salle 6) → mot secret <b>ÉQUIPE</b>.</li>\n        <li><b>Important :</b> le sifflet doré du gymnase (salle 2) sert dans la salle 6. Les élèves peuvent revenir dans une salle déjà terminée via le plan.</li>\n        <li><b>Enveloppes du Maître :</b> 3 par salle, cachées dans le décor. Chacune contient une question (QCM, vrai/faux, associer). Bonne réponse = 1 étoile + 1 indice pour la salle. Il faut les 3 étoiles pour sortir.</li>\n        <li><b>Aides :</b> bouton 👁 « Montrer les zones » (gratuit) pour voir ce qui est cliquable ; bouton 💡 « Indice » (−1 min), qui s'adapte à l'avancée dans la salle.</li>\n        <li><b>Indices :</b> chaque indice coûte 1 min. À 0:00, le jeu passe en prolongation (le chrono compte le temps supplémentaire).</li>\n        <li><b>Fin :</b> page de victoire avec étoiles (3★ = fini à temps avec 3 indices max) et diplôme imprimable.</li>\n        <li><b>Son :</b> petits effets sonores (sifflet, bonne réponse). Bouton 🔊 en haut pour couper.</li>\n      </ul>\n    </div>\n\n    <div class=\"panel\">\n      <h2>🔑 Corrigé complet</h2>\n      <div id=\"sol\"></div>\n    </div>\n  </section>\n</main>",run:function(){

(function(){
  const PASSWORD='COUPEDOR26';
  function open(){
    document.getElementById('gate').hidden=true;
    document.getElementById('zone').hidden=false;
    try{sessionStorage.setItem('eg_prof','1')}catch(e){}
    status(); solutions();
  }
  function status(){
    const S=EG.state;
    const done=EG.ROOMS.filter(r=>S.rooms[r.id]).length;
    document.getElementById('status').innerHTML = S.start
      ? `Équipe : <span style="color:var(--gold)">${EG.esc(S.team)}</span> — Chrono : <span style="color:var(--gold)">${EG.fmt(EG.remaining())}</span> — Salles terminées : ${done}/6 — Indices : ${S.hints} — Erreurs : ${S.errors}`
      : `Aucune partie en cours sur cet appareil.`;
  }
  setInterval(status,1000);
  function solutions(){
    document.getElementById('sol').innerHTML = EG.ROOMS.map(r=>`
      <h3 style="margin-top:20px;color:var(--teal)">Salle ${r.id} — ${r.name} ${r.final?'<span style="color:var(--gold)">(médaille : lettre E)</span>':`<span style="color:var(--gold)">(lettre ${r.letter})</span>`}</h3>
      <p style="margin:6px 0 2px;color:var(--gold);font-weight:800">✉️ Les 3 enveloppes (questions) :</p>
      <ul style="line-height:1.6">${r.questions.map(q=>`<li><b>${q.title}</b> → <span style="color:#3ddc84">${q.type==='qcm'?q.options[q.answer]:q.type==='tf'?q.items.map(x=>x.a?'V':'F').join(' / '):q.pairs.map(x=>x[0]+' = '+x[1]).join(' ; ')}</span></li>`).join('')}</ul>
      <p style="margin:6px 0 2px;color:var(--gold);font-weight:800">🔎 Fouille et cadenas :</p>
      <ol style="line-height:1.7">${r.solution.map(x=>`<li>${x}</li>`).join('')}</ol>`).join('');
  }
  document.getElementById('gateForm').onsubmit=e=>{
    e.preventDefault();
    if(document.getElementById('pwd').value.trim().toUpperCase()===PASSWORD) open();
    else document.getElementById('gateMsg').textContent='Mot de passe incorrect.';
  };
  document.getElementById('plus').onclick=()=>{EG.setState(s=>s.penalty-=300);status();};
  document.getElementById('minus').onclick=()=>{EG.setState(s=>s.penalty+=300);status();};
  document.getElementById('unlock').onclick=()=>{EG.setState(s=>{s.unlockAll=true; if(!s.start){s.start=Date.now();s.team=s.team||'Test prof';}});status();};
  document.getElementById('reset').onclick=()=>{
    EG.modal(`<h2>↺ Réinitialiser ?</h2><p>La partie en cours sur cet appareil sera effacée.</p>`,[
      {label:'Oui, réinitialiser',action:()=>{EG.reset();location.reload();}},{label:'Annuler',cls:'ghost'}]);
  };
  try{ if(sessionStorage.getItem('eg_prof')==='1') open(); }catch(e){}
})();

}},
